modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''
# The server does all the work. A client without this mod can still join (it just draws no beam
# to held entities, and a held player is moved with vanilla motion packets), and a client with
# it can join servers without it.
displayTest="IGNORE_ALL_VERSION"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="camafy"
    mandatory=true
    versionRange="${camafy_version_range}"
    ordering="AFTER"
    side="BOTH"

# Optional: without VMod the mod loads and does nothing (it logs that once). Loading after VMod
# keeps its tick handler behind VMod's physgun state being set up.
[[dependencies.${mod_id}]]
    modId="the_vmod"
    mandatory=false
    versionRange="*"
    ordering="AFTER"
    side="BOTH"
