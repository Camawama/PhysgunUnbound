# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false


## Environment Properties

minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.16
# 47.4 is the first build with the ResourceLocation.fromNamespaceAndPath backport Camafy uses.
forge_version_range=[47.4,)
loader_version_range=[47,)
mapping_channel=parchment
mapping_version=2023.09.03-1.20.1


## Mod Properties

mod_id=physgununbound
mod_name=Physgun Unbound
# GPL-3.0 to match Camafy. Easy to change: this line, LICENSE.txt and the README's licence section.
mod_license=GPL-3.0
mod_version=1.0.0
mod_group_id=net.camacraft.physgununbound
mod_authors=Camawama
mod_description=An addon for VMod: its physgun picks up and moves entities too, not just Valkyrien Skies ships. Mobs, animals, items, boats, minecarts, falling blocks, armor stands and players are held, pulled, pushed, turned, frozen and thrown with the physgun's own buttons.


## Dependencies

# Camafy, the shared library mod (from mavenLocal). 0.1.13 is the oldest this mod is built and
# tested against; it uses PhysicsOwnership, MatchPolicies, Gravity.isAnchored, EntityScale,
# ShipEntities.letGo (0.1.12) and Ships.clip.
camafy_version=0.1.18
# The Camafy versions this mod accepts at runtime.
camafy_version_range=[0.1.18,0.2)

# VMod (SpaceEye's Valkyrien Skies addon), compile-only: Modrinth version id of
# VMod-Forge-1.20.1-1.9.1.jar, byte-identical to the jar in the owner's pack. Only the classes in
# vmod/ and mixin/vmod/ name VMod types, and they are only loaded when VMod is installed. The
# physgun API this mod uses is the same in VMod 1.7.1, 1.8.0, 1.9.0 and 1.9.1.
vmod_modrinth_version=xuf6SajY
# The Kotlin standard library VMod 1.9.1 was compiled against (compile-only, so javac can read
# VMod's class files; Kotlin for Forge supplies it at runtime).
kotlin_stdlib_version=2.1.0

# Only for the opt-in VMod tests (-Pvmod): Modrinth version ids of Valkyrien Skies
# 1.20.1-forge-2.4.11 (the same pins as Camafy's and Unleashed Lead's builds), Kotlin for Forge
# 4.12.0 (VMod 1.9.1 is built with Kotlin 2.1; the pack has 4.12.0) and Architectury 9.1.12 for
# Forge (the one Clockwork and VLib nest in the pack).
vs_modrinth_version=pOkdwuUh
vs_core_version=1.1.0+cf208d8b56
kotlin_for_forge_modrinth_version=Zsh14XeQ
architectury_modrinth_version=gyJ7kDpb
